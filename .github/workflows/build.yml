name: Build New Game+

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
            cmake_args: ""

          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            cmake_args: ""

          - platform: macos-arm64
            runner: macos-latest
            cmake_args: ""

          - platform: macos-x86_64
            runner: macos-latest
            cmake_args: "-DCMAKE_OSX_ARCHITECTURES=x86_64"

          - platform: ios-arm64
            runner: macos-latest
            cmake_args: "-DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0"

          - platform: windows-amd64
            runner: windows-latest
            cmake_args: "-A x64"

          - platform: windows-arm64
            runner: windows-latest
            cmake_args: "-A ARM64"

          - platform: android-aarch64
            runner: ubuntu-latest
            cmake_args: "-DCMAKE_SYSTEM_NAME=Android -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a -DCMAKE_SYSTEM_VERSION=28"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java
        if: matrix.platform == 'android-aarch64'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android NDK
        if: matrix.platform == 'android-aarch64'
        uses: android-actions/setup-android@v3

      - name: Configure CMake
        shell: bash
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            ${{ matrix.cmake_args }}

      - name: Build mod
        run: cmake --build build --config Release --parallel

      - name: Debug build output
        shell: bash
        run: |
          echo "Platform: ${{ matrix.platform }}"
          echo "Source metadata:"
          cat mod.json.in
          echo "Generated metadata files:"
          find build -name mod.json -type f -print
          echo "Bundle files:"
          find build/mods -maxdepth 2 -type f -print

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: mod-${{ matrix.platform }}
          path: build/mods/*.dusk
          if-no-files-found: error

  combine:
    name: Combine bundles
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: mod-*
          path: dist
          merge-multiple: false

      - name: Install symgen
        shell: bash
        env:
          SYMGEN_VERSION: v1.2.4
        run: |
          set -e
          curl -fL \
            "https://github.com/TwilitRealm/symgen/releases/download/${SYMGEN_VERSION}/symgen-linux-x86_64" \
            -o symgen
          chmod +x symgen
          ./symgen --help

      - name: Compare mod.json in bundles
        shell: bash
        run: |
          set -e

          for bundle in dist/mod-android-aarch64/*.dusk dist/mod-windows-amd64/*.dusk; do
            if [ ! -f "$bundle" ]; then
              echo "Bundle not found: $bundle"
              exit 1
            fi

            echo "========== $bundle =========="
            unzip -l "$bundle"

            echo "---------- mod.json ----------"
            unzip -p "$bundle" mod.json || true
            echo
          done

      - name: Merge bundles
        shell: bash
        run: |
          set -e
          mkdir -p combined

          name=$(basename dist/mod-linux-x86_64/*.dusk)

          python3 tools/merge_mod.py \
            -o "combined/$name" \
            --symgen ./symgen \
            dist/*/*.dusk

      - name: Upload combined bundle
        uses: actions/upload-artifact@v4
        with:
          name: mod-combined
          path: combined/*.dusk
          if-no-files-found: error

      - name: Attach bundle to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: combined/*.dusk
